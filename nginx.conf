# Rate limiting zone — defined at http context level
# Keyed by client IP, 10 MB shared memory, 10 requests/second burst limit
limit_req_zone $binary_remote_addr zone=emailstmp_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;  # Replace with your actual domain

    # --- SSL certificates (populated by Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year) — only enable once SSL is confirmed working
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide Nginx version from error pages and Server header
    server_tokens off;

    # Apply rate limiting to all API routes
    # burst=20 allows short bursts; nodelay serves them immediately rather than queuing
    limit_req zone=emailstmp_api burst=20 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://localhost:3000;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for streaming / SSE responses if needed
        proxy_buffering off;

        # Extended timeout for batch email sends which can take time
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;

        # Pass WebSocket upgrade headers (future-proofing)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint — excluded from rate limiting
    location /health {
        limit_req off;
        proxy_pass http://localhost:3000/health;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }
}
